<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico — LPO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; margin: 0; }
        .card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
        th, td { text-align: left; padding: 0.5rem 0.7rem; white-space: nowrap; }
        thead th { color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.65rem; letter-spacing: 0.04em; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; background: #fff; }
        tbody tr { border-bottom: 1px solid #f1f5f9; }
        tbody tr:hover { background-color: #f8fafc; }
        nav a { font-size: 0.8rem; font-weight: 700; color: #475569; }
        nav a.active, nav a:hover { color: #0f766e; }
        select { border: 1px solid #cbd5e1; border-radius: 8px; padding: 0.4rem 0.6rem; font-size: 0.85rem; }
    </style>
</head>
<body class="p-4 md:p-6 lg:p-8">
    <div class="max-w-6xl mx-auto space-y-6">

        <header class="bg-white p-6 rounded-2xl border border-slate-200 border-t-4 border-t-teal-700 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-5 w-full md:w-auto">
                <div class="w-16 h-16 bg-teal-50 rounded-xl flex items-center justify-center border border-teal-100 shrink-0">
                    <i class="fa-solid fa-table-list text-2xl text-teal-700"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-800 tracking-tight">Histórico de observaciones</h1>
                    <p class="text-slate-500 font-semibold text-sm mt-1">Datos guardados en la planilla de Google Sheets</p>
                </div>
            </div>
            <nav class="flex items-center gap-4 shrink-0">
                <a href="index.html"><i class="fa-solid fa-pen-to-square mr-1"></i>Cargar</a>
                <a href="historico.html" class="active"><i class="fa-solid fa-table-list mr-1"></i>Histórico</a>
                <a href="formulas.html"><i class="fa-solid fa-square-root-variable mr-1"></i>Fórmulas</a>
            </nav>
        </header>

        <div id="estado" class="card text-sm text-slate-500 flex items-center gap-2">
            <i class="fa-solid fa-circle-notch fa-spin"></i> Cargando histórico...
        </div>

        <div id="contenido" class="hidden space-y-6">
            <div class="card">
                <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                    <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wide flex items-center">
                        <i class="fa-solid fa-chart-line mr-2 text-slate-500"></i> Variable en el tiempo
                    </h3>
                    <select id="selectVariable">
                        <option value="tSeca">T. Seca (°C)</option>
                        <option value="tHumeda">T. Húmeda (°C)</option>
                        <option value="puntoRocio">Punto de Rocío (°C)</option>
                        <option value="humedadRelativa">Humedad Relativa (%)</option>
                        <option value="pEstHpa">P. Estación (hPa)</option>
                        <option value="pnmHpa">P. Nivel del Mar (hPa)</option>
                        <option value="tensionVapor">Tensión de Vapor (hPa)</option>
                        <option value="lluvia">Lluvia (mm)</option>
                    </select>
                </div>
                <div class="relative w-full h-[280px]">
                    <canvas id="chartVariable"></canvas>
                </div>
            </div>

            <div class="card">
                <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wide mb-4 flex items-center">
                    <i class="fa-solid fa-list mr-2 text-slate-500"></i> Observaciones
                    <span class="ml-2 normal-case font-medium text-slate-400 text-xs" id="conteo"></span>
                </h3>
                <div class="overflow-x-auto max-h-[520px] overflow-y-auto">
                    <table>
                        <thead>
                            <tr>
                                <th>Fecha</th><th>Hora</th><th>T. Seca</th><th>T. Húmeda</th>
                                <th>T. Máx</th><th>T. Mín</th><th>T. Adj.</th><th>Barómetro</th>
                                <th>P. Est (mmHg)</th><th>P. Est (hPa)</th><th>P.N.M (mmHg)</th><th>P.N.M (hPa)</th>
                                <th>Tensión Vapor</th><th>P. Rocío</th><th>H.R.</th><th>Lluvia</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const fmt = (n, dec = 1) => (typeof n === "number" && Number.isFinite(n) ? n.toFixed(dec) : "");

        function cargarHistorico() {
            return new Promise((resolve, reject) => {
                const callbackName = "onHistorico_" + Date.now();
                window[callbackName] = (data) => {
                    delete window[callbackName];
                    document.getElementById(callbackName + "_script")?.remove();
                    resolve(data);
                };
                const script = document.createElement("script");
                script.id = callbackName + "_script";
                script.src =
                    APPS_SCRIPT_URL +
                    "?callback=" + callbackName +
                    "&token=" + encodeURIComponent(APPS_SCRIPT_TOKEN);
                script.onerror = () => reject(new Error("No se pudo cargar el histórico desde Apps Script."));
                document.body.appendChild(script);
            });
        }

        let chart;
        function pintarTabla(filas) {
            const tbody = document.getElementById("tbody");
            tbody.innerHTML = filas
                .map(
                    (f) => `<tr>
                <td>${f.fecha || ""}</td><td>${f.hora || ""}</td>
                <td>${fmt(f.tSeca)}</td><td>${fmt(f.tHumeda)}</td>
                <td>${fmt(f.tMax)}</td><td>${fmt(f.tMin)}</td>
                <td>${fmt(f.tAdjunto)}</td><td>${fmt(f.barometro, 2)}</td>
                <td>${fmt(f.pEstMmhg)}</td><td>${fmt(f.pEstHpa)}</td>
                <td>${fmt(f.pnmMmhg)}</td><td>${fmt(f.pnmHpa)}</td>
                <td>${fmt(f.tensionVapor)}</td><td>${fmt(f.puntoRocio)}</td>
                <td>${fmt(f.humedadRelativa, 0)}</td><td>${fmt(f.lluvia)}</td>
            </tr>`
                )
                .join("");
            document.getElementById("conteo").textContent = `(${filas.length} registros)`;
        }

        function pintarChart(filas, variable) {
            const ctx = document.getElementById("chartVariable");
            const labels = filas.map((f) => `${f.fecha} ${f.hora}`);
            const datos = filas.map((f) => (typeof f[variable] === "number" ? f[variable] : null));
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels,
                    datasets: [
                        {
                            label: document.getElementById("selectVariable").selectedOptions[0].textContent,
                            data: datos,
                            borderColor: "#0f766e",
                            backgroundColor: "rgba(15,118,110,0.1)",
                            tension: 0.25,
                            spanGaps: true,
                        },
                    ],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { x: { ticks: { maxTicksLimit: 10 } } },
                },
            });
        }

        (async () => {
            try {
                if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PEGAR_URL")) {
                    throw new Error("Falta configurar APPS_SCRIPT_URL en config.js.");
                }
                const data = await cargarHistorico();
                if (!data.ok) throw new Error(data.error || "Error desconocido");
                const filas = data.filas || [];
                document.getElementById("estado").classList.add("hidden");
                document.getElementById("contenido").classList.remove("hidden");
                pintarTabla(filas);
                pintarChart(filas, "tSeca");
                document.getElementById("selectVariable").addEventListener("change", (e) => {
                    pintarChart(filas, e.target.value);
                });
            } catch (err) {
                document.getElementById("estado").innerHTML =
                    `<i class="fa-solid fa-triangle-exclamation text-red-600"></i> <span class="text-red-700">${err.message}</span>`;
            }
        })();
    </script>
</body>
</html>
