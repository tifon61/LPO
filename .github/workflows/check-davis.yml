name: Chequear disponibilidad de la Davis

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_whatsapp:
        description: "Mandar un WhatsApp de prueba (no toca el chequeo real)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DEBUG - buscar otras estaciones
        run: |
          echo "=== Homepage: links a /davis/ ==="
          curl -s https://meteo.fcaglp.unlp.edu.ar/ | grep -oE '(href|src)="[^"]*davis[^"]*"' | sort -u || true
          echo "=== Homepage: cualquier link relativo ==="
          curl -s https://meteo.fcaglp.unlp.edu.ar/ | grep -oE 'href="[^"]*"' | sort -u | head -60 || true
          echo "=== Directorio /davis/ (a ver si lista) ==="
          curl -s https://meteo.fcaglp.unlp.edu.ar/davis/ | head -100 || true
          echo "=== Probar nombres comunes de estación ==="
          for n in campo ciudad facultad observatorio sede estacion2 obs meteo unlp fcaglp la_plata laplata; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://meteo.fcaglp.unlp.edu.ar/davis/$n/downld08.txt")
            echo "$n -> $code"
          done
        continue-on-error: true

      - name: TEST - mandar WhatsApp de prueba
        if: github.event.inputs.test_whatsapp == 'true'
        run: |
          curl -s -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${{ secrets.CALLMEBOT_PHONE }}" \
            --data-urlencode "apikey=${{ secrets.CALLMEBOT_APIKEY }}" \
            --data-urlencode "text=✅ Prueba: así se va a ver el aviso cuando se caiga la Davis."

      - name: Instalar dependencias
        run: pip install --quiet -r scripts/requirements.txt

      - name: Chequear la Davis y actualizar data/davis-monitor.json
        id: check
        run: python3 scripts/check_davis.py

      - name: Avisar por WhatsApp si se acaba de caer
        if: steps.check.outputs.just_down == 'true'
        run: |
          curl -s -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${{ secrets.CALLMEBOT_PHONE }}" \
            --data-urlencode "apikey=${{ secrets.CALLMEBOT_APIKEY }}" \
            --data-urlencode "text=⚠️ Se cayó la Davis (campo): ${{ steps.check.outputs.reason }}"

      - name: Commitear si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/davis-monitor.json
          git diff --staged --quiet || git commit -m "Actualizar relevamiento de disponibilidad de la Davis"
          git push
