name: Chequear disponibilidad de la Davis

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install --quiet -r scripts/requirements.txt

      - name: DEBUG - inspeccionar cadena de certificados
        run: openssl s_client -connect meteo.fcaglp.unlp.edu.ar:443 -servername meteo.fcaglp.unlp.edu.ar -showcerts </dev/null 2>&1 | head -100
        continue-on-error: true

      - name: Chequear la Davis y actualizar data/davis-monitor.json
        run: python3 scripts/check_davis.py

      - name: Commitear si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/davis-monitor.json
          git diff --staged --quiet || git commit -m "Actualizar relevamiento de disponibilidad de la Davis"
          git push
