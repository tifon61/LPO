name: Chequear disponibilidad de la Davis

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install --quiet -r scripts/requirements.txt

      - name: DEBUG - bajar y mostrar el certificado intermedio faltante
        run: |
          curl -s http://crt.sectigo.com/ZeroSSLECCDVSSLCA2.crt -o /tmp/inter.der
          openssl x509 -inform der -in /tmp/inter.der -out /tmp/inter.pem
          cat /tmp/inter.pem
          openssl x509 -in /tmp/inter.pem -noout -subject -issuer -fingerprint -sha256
        continue-on-error: true

      - name: Chequear la Davis y actualizar data/davis-monitor.json
        run: python3 scripts/check_davis.py

      - name: Commitear si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/davis-monitor.json
          git diff --staged --quiet || git commit -m "Actualizar relevamiento de disponibilidad de la Davis"
          git push
