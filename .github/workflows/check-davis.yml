name: Chequear disponibilidad de estaciones

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_whatsapp:
        description: "Mandar un WhatsApp de prueba (no toca el chequeo real)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: TEST - mandar WhatsApp de prueba
        if: github.event.inputs.test_whatsapp == 'true'
        run: |
          curl -s -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${{ secrets.CALLMEBOT_PHONE }}" \
            --data-urlencode "apikey=${{ secrets.CALLMEBOT_APIKEY }}" \
            --data-urlencode "text=✅ Prueba: así se va a ver el aviso cuando se caiga la Davis."

      - name: Instalar dependencias
        run: pip install --quiet -r scripts/requirements.txt

      - name: Chequear la Davis y actualizar data/davis-monitor.json
        id: check
        run: python3 scripts/check_davis.py

      - name: Avisar por WhatsApp si se acaba de caer
        if: steps.check.outputs.just_down == 'true'
        run: |
          curl -s -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${{ secrets.CALLMEBOT_PHONE }}" \
            --data-urlencode "apikey=${{ secrets.CALLMEBOT_APIKEY }}" \
            --data-urlencode "text=⚠️ Se cayó la Davis (campo): ${{ steps.check.outputs.reason }}"

      - name: Avisar por WhatsApp si se acaba de recuperar
        if: steps.check.outputs.just_recovered == 'true'
        run: |
          curl -s -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${{ secrets.CALLMEBOT_PHONE }}" \
            --data-urlencode "apikey=${{ secrets.CALLMEBOT_APIKEY }}" \
            --data-urlencode "text=✅ Volvió la Davis (campo), había estado caída ${{ steps.check.outputs.recovered_duration }}"

      - name: Chequear la red de estaciones (ThingSpeak/Wunderground)
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python3 scripts/check_stations.py

      - name: Commitear si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/davis-monitor.json data/stations-monitor.json
          git diff --staged --quiet || git commit -m "Actualizar relevamiento de disponibilidad"
          git push
